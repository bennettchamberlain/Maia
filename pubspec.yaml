# Pub workspace root for the Dart packages and server. The Flutter app
# resolves separately: flutter_test needs analyzer >=8, gel 0.6 needs <8.
name: maie_workspace
publish_to: none
environment:
  sdk: ^3.13.0
workspace:
  - packages/maie_models
  - packages/maie_api_client
  - packages/maie_jobs
  - server/maie
  - evals/chat
