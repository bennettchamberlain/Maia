<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>__TITLE__</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; }
  body {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  canvas { display: block; width: min(440px, 78vw); height: min(440px, 78vw); }
  h1 {
    margin: 8px 0 0;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  p {
    margin: 10px 0 0;
    max-width: 28rem;
    padding: 0 24px;
    text-align: center;
    font-size: 14px;
    line-height: 1.45;
    color: rgba(255, 255, 255, 0.62);
  }
</style>
</head>
<body>
<canvas id="maia" width="880" height="880" aria-label="Maia"></canvas>
<h1>__TITLE__</h1>
<p>__TEXT__</p>
<script>
(function () {
  const canvas = document.getElementById("maia");
  const ctx = canvas.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sun = norm(-0.58, 0.16, 0.80);
  const sunset = [
    [0.00, [8, 4, 14]],
    [0.14, [74, 12, 86]],
    [0.32, [255, 42, 106]],
    [0.50, [255, 92, 36]],
    [0.68, [255, 186, 64]],
    [0.84, [255, 244, 224]],
    [1.00, [255, 255, 255]],
  ];
  const lats = [-66, -42, -18, 0, 18, 42, 66];
  const lines = [];
  const dots = [];
  for (const lat of lats) {
    const n = lat === 0 ? 220 : 96;
    const row = [];
    for (let i = 0; i < n; i++) {
      const p = { lat: rad(lat), lon: (i / n) * Math.PI * 2, ring: lat === 0 };
      row.push(p);
      dots.push(p);
    }
    lines.push(row);
  }
  for (let k = 0; k < 12; k++) {
    const lon = (k / 12) * Math.PI * 2;
    const row = [];
    for (let i = 1; i < 28; i++) {
      const p = { lat: -Math.PI / 2 + (i / 28) * Math.PI, lon, ring: false };
      row.push(p);
      if (i % 2 === 0) dots.push(p);
    }
    lines.push(row);
  }

  let yaw = 0.7;
  let frame = 0;
  function draw() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const css = Math.min(440, Math.min(innerWidth, innerHeight) * 0.72);
    canvas.style.width = css + "px";
    canvas.style.height = css + "px";
    canvas.width = Math.round(css * dpr);
    canvas.height = Math.round(css * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cx = css / 2;
    const cy = css * 0.42;
    const R = css * 0.24;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, css, css);
    bezel(cx, cy, R);
    const placed = dots.map((p) => place(p, yaw, R));
    for (const row of lines) {
      const close = row[0] && row[0].ring;
      const count = close ? row.length + 1 : row.length;
      for (let i = 1; i < count; i++) {
        const a = place(row[(i - 1) % row.length], yaw, R);
        const b = place(row[i % row.length], yaw, R);
        ctx.beginPath();
        ctx.moveTo(cx + a.x, cy + a.y);
        ctx.lineTo(cx + b.x, cy + b.y);
        ctx.strokeStyle = ink((a.light + b.light) / 2).line;
        ctx.lineWidth = close ? 1.15 : 0.6;
        ctx.stroke();
      }
    }
    placed.sort((a, b) => a.z - b.z);
    for (const q of placed) {
      const tone = ink(q.light);
      ctx.fillStyle = tone.dot;
      const s = q.ring ? 1.7 : 1.15;
      ctx.fillRect(cx + q.x - s / 2, cy + q.y - s / 2, s, s);
    }
    bar(cx, cy, R);
    plate(cx, cy, R, yaw);
    if (!reduced) yaw += 0.0042;
  }
  function place(p, yaw, R) {
    const lon = p.lon + yaw;
    let x = Math.cos(p.lat) * Math.cos(lon);
    let y = Math.sin(p.lat);
    let z = Math.cos(p.lat) * Math.sin(lon);
    const tilt = 0.42;
    const y2 = y * Math.cos(tilt) - z * Math.sin(tilt);
    const z2 = y * Math.sin(tilt) + z * Math.cos(tilt);
    const scale = p.ring ? R * 1.08 : R * 0.78;
    return {
      x: x * scale,
      y: y2 * scale,
      z: z2,
      light: x * sun.x + y2 * sun.y + z2 * sun.z,
      ring: p.ring,
    };
  }
  function ink(light) {
    if (light > 0.22) {
      const a = 0.45 + light * 0.5;
      return { dot: rgba(255, 255, 255, a), line: "rgba(255,255,255,0.28)" };
    }
    if (light < -0.34) {
      return { dot: "rgba(255,255,255,0.14)", line: "rgba(255,255,255,0.08)" };
    }
    const t = (light + 0.34) / 0.56;
    const [r, g, b] = sample(t);
    return { dot: rgba(r, g, b, 0.95), line: rgba(r, g, b, 0.85) };
  }
  function sample(t) {
    const u = Math.min(1, Math.max(0, t));
    let i = 1;
    while (i < sunset.length - 1 && sunset[i][0] < u) i++;
    const a = sunset[i - 1];
    const b = sunset[i];
    const f = (u - a[0]) / (b[0] - a[0] || 1);
    return a[1].map((v, k) => Math.round(v + (b[1][k] - v) * f));
  }
  function bezel(cx, cy, R) {
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, R * 1.46, 0, Math.PI * 2);
    ctx.stroke();
    for (let i = 0; i < 72; i++) {
      const a = (i / 72) * Math.PI * 2;
      const major = i % 6 === 0;
      const inner = R * (major ? 1.34 : 1.40);
      ctx.strokeStyle = major ? "rgba(255,255,255,0.8)" : "rgba(255,255,255,0.28)";
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
      ctx.lineTo(cx + Math.cos(a) * R * 1.46, cy + Math.sin(a) * R * 1.46);
      ctx.stroke();
    }
  }
  function bar(cx, cy, R) {
    const g = ctx.createLinearGradient(cx - R, 0, cx + R, 0);
    g.addColorStop(0, "#000");
    g.addColorStop(0.22, "#12040e");
    g.addColorStop(0.40, "#ff2a6a");
    g.addColorStop(0.56, "#ff5c24");
    g.addColorStop(0.72, "#ffba40");
    g.addColorStop(0.88, "#fff");
    g.addColorStop(1, "#fff");
    const y = cy + R * 1.62;
    const w = R * 1.2;
    ctx.fillStyle = g;
    ctx.fillRect(cx - w / 2, y, w, 2);
  }
  function plate(cx, cy, R, yaw) {
    const deg = ((yaw * 180 / Math.PI) % 360 + 360) % 360;
    const y = cy + R * 1.95;
    ctx.font = "11px ui-monospace, ui-monospace, monospace";
    ctx.fillStyle = "rgba(255,255,255,0.72)";
    ctx.fillText("MAIA", cx - R * 1.46, y);
    ctx.fillStyle = "rgba(255,255,255,0.40)";
    ctx.textAlign = "right";
    ctx.fillText("ORBIT " + deg.toFixed(1) + "\u00b0", cx + R * 1.46, y);
    ctx.textAlign = "left";
  }
  function rgba(r, g, b, a) {
    return "rgba(" + r + "," + g + "," + b + "," + a.toFixed(3) + ")";
  }
  function rad(d) { return d * Math.PI / 180; }
  function norm(x, y, z) {
    const n = Math.hypot(x, y, z);
    return { x: x / n, y: y / n, z: z / n };
  }
  function pump() {
    draw();
    if (!reduced) frame = requestAnimationFrame(pump);
  }
  pump();
  if (reduced) addEventListener("resize", draw);
})();
</script>
</body>
</html>
