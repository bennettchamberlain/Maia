name: maie_api
description: "maie-api: Dart server over Napalm (sign-in, ingest, memory, jobs)"
version: 0.1.0+1
publish_to: none

resolution: workspace
environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.6
  gel: ^0.6.0
  http: ^1.2.0
  postgres: ^3.5.0
  maie_jobs:
    path: ../../packages/maie_jobs
  maie_models:
    path: ../../packages/maie_models
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  mocktail: ^1.0.5
  test: ^1.26.3
  very_good_analysis: ^11.0.0

executables:
  maie_api: main
